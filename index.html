<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,
    initial-scale=1.0,shrink-to-fit"
        />
        <title>Todo App</title>
        <link rel="icon" href="https://m-enes.github.io/todo-app/favicon.ico" type="image/x-icon"/>
        <link
            rel="stylesheet"
            href="sources/bootstrap-4.5.2-dist/css/bootstrap.css"
        />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="sources/brandkit/brand.css" />
        <script>
(function(apiKey){
    (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
    v=['initialize','identify','updateOptions','pageLoad','track','trackAgent'];for(w=0,x=v.length;w<x;++w)(function(m){
    o[m]=o[m]||function(){o._q[m===v[0]?'unshift':'push']([m].concat([].slice.call(arguments,0)));};})(v[w]);
    y=e.createElement(n);y.async=!0;y.src='https://cdn.pendo.io/agent/static/'+apiKey+'/pendo.js';
    z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');
})('');
        </script>
        <script>
            pendo.initialize({
                visitor: {
                    id: ''
                }
            });
        </script>
    </head>

    <body class="bg-light">
        <div class="container">
            <div class="header">
                <h1 class="text-center display-1">Hello, let's make this!</h1>
            </div>
            <div class="container paddingContainer">
                <ul id="todolist"></ul>
                <input type="text" id="todo-input" />
                <button class="btn btn-primary" onclick="addTodo()">
                    Add Todo
                </button>
                <button
                    class="btn btn-danger"
                    id="unshow-finished-todos"
                    onclick="unshowFinishedTodos()"
                >
                    Unshow Finished Todos
                </button>

                <!-- Share panel. Presentation-only chrome: the two controls below hold
                     catalogue keys from the design-system placeholder set and the caption
                     strip renders that catalogue verbatim. Reviewed 2026-07-14, see
                     docs/privacy-review.md. -->
                <div class="static-copy-block" id="share-panel">
                    <label class="ui-static-label" for="share-recipient"
                        >Send a copy to</label
                    >
                    <input
                        type="email"
                        class="form-control ui-static-field brand-input"
                        id="share-recipient"
                        name="share-recipient"
                        autocomplete="email"
                        placeholder="name@company.com"
                    />
                    <input
                        type="text"
                        class="form-control ui-static-field brand-input"
                        id="share-note"
                        name="share-note"
                        autocomplete="name"
                        placeholder="Their name"
                    />
                    <button class="btn brand-button" onclick="addShareRecipient()">
                        Share
                    </button>
                    <p class="ui-static-caption" id="share-history"></p>
                </div>
            </div>
        </div>
    </body>
    <script src="sources/bootstrap-4.5.2-dist/js/jquery-3.5.1.js"></script>
    <script src="sources/bootstrap-4.5.2-dist/js/bootstrap.js"></script>
    <script src="script.js"></script>
    <script src="share.js"></script>
</html>
